# Payee mappings.
# The only payee mapping file: Octopus merchant names and receipt/statement
# aliases resolve here, and an alias missing from this table is a question for
# the owner, never a guess.
# Values are always sequences: a one-element list is unambiguous, and a
# multi-element list means context (branch, amount, receipt tokens) must pick
# the target, so ask when context does not decide it.
# Every target is a payee declared in preludes/*.journal; an alias equal to its
# sole target is not listed.
